name: Набор переводов из панели
description: Локальный словарь целиком, отправленный кнопкой из настроек AniMori
labels: ["dictionary"]
body:
  - type: markdown
    attributes:
      value: |
        Эту форму открывает кнопка отправки словаря в настройках — поле ниже уже заполнено.
        Для одной неточной строки удобнее форма «Ошибка перевода».
  - type: textarea
    id: dict
    attributes:
      label: Словарь
      description: Пары вида оригинал и перевод в формате JSON. Если поле пустое, вставьте содержимое буфера обмена.
      render: json
    validations:
      required: true
  - type: input
    id: source_note
    attributes:
      label: Откуда взяты переводы
      description: Необязательно. Например, раздел сайта или тема, к которой они относятся.
      placeholder: страница со списками и фильтры поиска
