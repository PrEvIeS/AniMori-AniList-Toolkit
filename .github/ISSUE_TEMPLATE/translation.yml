name: Ошибка перевода
description: Неточный или отсутствующий перевод в общем словаре
labels: ["dictionary"]
body:
  - type: markdown
    attributes:
      value: |
        Общий словарь живёт в ветке main и применяется у всех без обновления AniMori.
        Если перевод нужен только вам, быстрее добавить его в локальный словарь в настройках.
  - type: input
    id: source
    attributes:
      label: Оригинальная строка
      description: Точно так, как она написана на AniList, с тем же регистром.
      placeholder: Add to List
    validations:
      required: true
  - type: input
    id: translation
    attributes:
      label: Предлагаемый перевод
      placeholder: Добавить в список
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Где встретилось
      description: Раздел или адрес страницы. Одно и то же слово в разных местах переводится по-разному.
      placeholder: карточка тайтла, кнопка под постером
  - type: textarea
    id: dict
    attributes:
      label: Набор пар сразу
      description: Сюда попадает словарь из кнопки «Поделиться» в настройках. Для одной строки поле можно оставить пустым.
      render: json
