name: Apply audit fixes
on:
  push:
    branches: [desktop-dev]
    paths:
      - .github/workflows/apply-audit-fixes.yml
      - scripts/audit-patch.b64
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reviewed patches
        run: base64 -d scripts/audit-patch.b64 | gzip -d > /tmp/fix.mjs && node /tmp/fix.mjs
      - name: Format and verify
        run: |
          npx prettier --write src/api/anilist.ts src/api/shikimori.ts src/features/scanner/index.ts src/features/exporter/index.ts src/main.ts
          npm run typecheck
          npm run build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-audit-fixes.yml scripts/audit-patch.b64
          git add src
          git commit -m 'fix(features): harden scanner and exporter'
          git push origin HEAD:desktop-dev
