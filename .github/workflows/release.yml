# Сборка и выкладка релиза (пункт П.1 из RM4.md).
#
# Запуск только по тегу вида v2.0.0. По пушу в ветку сборка не идёт: каждый
# прогон — это полная компиляция Rust на windows-latest, а смысл она имеет
# только для выпуска.
#
# Что уезжает в релиз:
#   1. AniMori_<версия>_x64-setup.exe — установщик, на который смотрит апдейтер;
#   2. его же .sig — подпись, без неё обновление не будет принято;
#   3. latest.json — манифест обновлений;
#   4. AniMori_Setup.exe — копия установщика под коротким именем для людей и README;
#   5. animori.user.js — сборка юзерскрипта для GreasyFork;
#   6. AniMori_<версия>_x64-portable.zip — приложение без установки.
#
# Почему копия, а не переименование. latest.json ссылается на файл по имени,
# которое ему дал Tauri. Переименуешь артефакт — манифест покажет на несуществующий
# адрес, и обновление упадёт у всех сразу. Подпись считается от содержимого,
# поэтому копия под другим именем ничему не мешает.
#
# ВАЖНО ПРО ОТМЕНУ. Удаление тега уже запущенный прогон не останавливает: он
# работает со своей копией кода и на финальном шаге создаёт тег заново вместе
# с релизом. Чтобы отменить выпуск, сначала жми Cancel во вкладке Actions,
# и только потом удаляй тег.

name: release

on:
  push:
    tags:
      - 'v*'

# Без этого токен прогона только читает, и создание релиза упадёт на 403.
permissions:
  contents: write

jobs:
  # Windows идёт первой и создаёт сам релиз: она же собирает юзерскрипт
  # для GreasyFork, который к платформе отношения не имеет.
  release:
    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      # Текст верхнего раздела CHANGELOG уходит и в описание релиза, и в окно
      # обновления внутри приложения: апдейтер показывает пользователю ровно
      # то, что лежит в поле notes манифеста, а туда попадает описание релиза.
      # Поэтому отсылка вида "См. CHANGELOG.md" здесь бесполезна — человек
      # видит её в диалоге вместо перечня изменений.
      #
      # Разбор простой: находим строки вида "## [" и берём всё между первой
      # и второй. Заголовок раздела не нужен — номер версии и так в имени релиза.
      - name: Описание релиза из CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $marks = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' }
          if ($marks.Count -eq 0) {
            throw 'В CHANGELOG.md не найдено ни одного раздела вида "## [версия]"'
          }
          $from = $marks[0] + 1
          $to = if ($marks.Count -gt 1) { $marks[1] - 1 } else { $lines.Count - 1 }
          $body = ($lines[$from..$to] -join "`n").Trim()
          # Потолок на случай очень большого раздела: тело релиза уходит в манифест
          # обновлений, раздувать его нечем.
          if ($body.Length -gt 3000) {
            $body = $body.Substring(0, 3000).TrimEnd() + "`n`n…полный список изменений — в CHANGELOG.md"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'body<<ANIMORI_NOTES'
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'ANIMORI_NOTES'
          Write-Host "Взято строк описания: $($to - $from + 1)"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable

      # Компиляция зависимостей Tauri с нуля — это минуты. Кэш привязан к Cargo.lock,
      # который у нас закоммичен, поэтому попадание будет стабильным.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости npm
        run: npm ci

      # ПОРЯДОК ЗДЕСЬ ОБЯЗАТЕЛЕН. В vite.config.ts стоит emptyOutDir: !isTauri —
      # юзерскриптовая сборка чистит dist/, тауриная — нет. Сначала скрипт,
      # потом приложение. Наоборот — и первая снесёт animori.tauri.js вместе
      # с CSS, а include_str! в lib.rs упадёт на компиляции.
      # Сборку режима tauri запускает сам tauri-action через beforeBuildCommand.
      - name: Сборка юзерскрипта
        run: npm run build

      # Копия скрипта в отдельную папку: следующим шагом тауриная сборка пишет
      # в тот же dist/, и держать готовый артефакт в рабочей папке сборщика незачем.
      - name: Отложить артефакт скрипта
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item dist/animori.user.js artifacts/animori.user.js

      # Собирает приложение, создаёт релиз по тегу, подписывает установщик
      # и сам генерирует latest.json. Писать манифест вручную не надо.
      #
      # Ключ подписи приходит только из секретов репозитория. В исходных файлах
      # его нет ни в каком виде и быть не может.
      - name: Сборка приложения и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AniMori ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Черновик и предварительный релиз оба выключены осознанно:
          # адрес releases/latest/download/... видит только опубликованный
          # непредварительный релиз, и апдейтер любой другой просто не заметит.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Короткое имя для человека. Исходный файл остаётся на месте нетронутым —
      # именно на него ссылается latest.json.
      - name: Копия установщика под коротким именем
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path src-tauri/target -Recurse -Filter *-setup.exe |
            Where-Object { $_.DirectoryName -match 'bundle\\nsis$' } |
            Select-Object -First 1
          if (-not $setup) {
            throw 'Установщик NSIS не найден — сборка что-то положила не туда'
          }
          Copy-Item $setup.FullName artifacts/AniMori_Setup.exe
          Write-Host "Исходный артефакт: $($setup.FullName)"

      # Портабл-версия. Отдельной цели сборки под неё у Tauri нет: приложение —
      # это один самодостаточный exe, интерфейс вшит в бинарник на этапе
      # компиляции. Поэтому просто берём его из target и упаковываем.
      #
      # Поиск рекурсивный: без явной цели Cargo кладёт бинарник в target/release,
      # а если сборщик передаст --target — в target/<тройка>/release. Отбираем
      # только файл из самой папки release: в deps лежат промежуточные копии.
      #
      # В автообновлении архив не участвует: подпись и latest.json Tauri считает
      # только для установщика. Портабл обновляется заменой файла вручную.
      #
      # Настройки и токен всё равно лягут в профиль пользователя
      # (AppData\Roaming\com.foulnike.animori) — переносимым является сам запуск
      # без установки, а не хранилище.
      - name: Портабл-архив
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter AniMori.exe |
            Where-Object { $_.DirectoryName -match 'release$' } |
            Select-Object -First 1
          if (-not $exe) {
            throw 'AniMori.exe не найден в src-tauri/target'
          }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $stage = "portable/AniMori_$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AniMori.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/AniMori_${version}_x64-portable.zip" -Force
          Write-Host "Портабл собран из: $($exe.FullName)"

      # Докладывает недостающие файлы в уже созданный релиз того же тега.
      - name: Доложить артефакты в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/animori.user.js
            artifacts/AniMori_Setup.exe
            artifacts/AniMori_*_x64-portable.zip

  # ── macOS ────────────────────────────────────────────────────────────────
  #
  # Отдельной джобой, а не матрицей: шаги почти не пересекаются. У Windows свой
  # разбор CHANGELOG на pwsh, копия установщика под коротким именем и портабл-архив;
  # здесь ничего этого нет, а есть универсальный бинарник, которого нет там.
  #
  # needs обязателен. Релиз по тегу создаёт джоба Windows, и эта только доносит
  # в него свои файлы. Без ожидания обе джобы полезли бы создавать один релиз
  # одновременно, и вторая упала бы на конфликте.
  release-macos:
    needs: release
    runs-on: macos-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Обе цели нужны для universal-apple-darwin: Tauri собирает бинарник
      # под каждую и склеивает их в один через lipo.
      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Зависимости npm
        run: npm ci

      # Юзерскрипт здесь не собирается: его уже выложила джоба Windows, а
      # emptyOutDir: !isTauri в vite.config.ts означает, что тауриная сборка
      # dist/ не чистит. Собирать второй раз незачем.
      #
      # --config докладывается поверх tauri.macos.conf.json, который держит
      # createUpdaterArtifacts выключенным: без ключа локальная сборка с ним
      # падает, а ключ есть только в CI.
      #
      # Именно inline-JSON, а не путь к файлу: --config разрешает путь
      # относительно текущего каталога, а он у действия не совпадает с src-tauri,
      # и сборка честно падала на "failed to read configuration file".
      #
      # universal-apple-darwin — один .dmg и на Intel, и на Apple Silicon.
      # Две раздельные сборки заставили бы человека выбирать процессор руками.
      - name: Сборка приложения и догрузка в релиз
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AniMori ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # Манифест обновлений один на обе платформы: действие дочитывает уже
          # выложенный latest.json и дописывает в него свою цель, а не заменяет
          # файл целиком. Поэтому джоба и идёт строго после Windows.
          includeUpdaterJson: true
          args: >-
            --target universal-apple-darwin
            --config {"bundle":{"createUpdaterArtifacts":true}}
