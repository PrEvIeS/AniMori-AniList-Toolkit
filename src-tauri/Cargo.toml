[package]
name = "animori"
version = "2.0.0"
description = "AniMori AniList Toolkit desktop shell"
authors = ["foulnike"]
license = "MIT"
repository = "https://github.com/foulnike/AniMori-AniList-Toolkit"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "animori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.5.4"
# Пункт 4.5: запоминает размер, положение и развёрнутость окна между запусками.
# Плагин десктопный: на мобильных платформах его в зависимости не добавляют, но
# сборок под них у нас нет, поэтому cfg-таргет здесь только запутывал бы Cargo.toml.
# Требует Rust >= 1.77.2 — ровно ту версию, что уже указана в rust-version выше.
tauri-plugin-window-state = "2"
