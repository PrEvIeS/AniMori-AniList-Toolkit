[package]
name = "animori"
version = "2.0.0"
description = "AniMori AniList Toolkit desktop shell"
authors = ["foulnike"]
license = "MIT"
repository = "https://github.com/foulnike/AniMori-AniList-Toolkit"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "animori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
